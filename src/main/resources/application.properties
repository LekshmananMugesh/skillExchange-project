# App
spring.application.name=SkillExchange

# Server port (Railway requirement ? Railway injects PORT dynamically)
server.port=${PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillexchange_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@123}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis (correct Spring Boot 3.x prefix)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
jwt.secret=${JWT_SECRET:skillexchange_secret_key_32characters}
jwt.expiration=604800000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:lekshmananmugesh03@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# Ollama (local dev only ? not reachable from Railway)
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434/api/generate}
ollama.model=${OLLAMA_MODEL:gemma:2b}

# Chatbot mode: 'ollama' for local dev, 'production' for cloud (uses Gemini)
chatbot.mode=${CHATBOT_MODE:ollama}

# Frontend URL for CORS (update CorsConfig.java to use this)
frontend.url=${FRONTEND_URL:http://localhost:5173}

